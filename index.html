<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Iron Kingdom Academia</title>
    <link rel="stylesheet" href="formulario.css">
</head>

<body>
    

    <div class="container">

        <div class="logo">
            🏋️ Iron Kingdom Academia
        </div>

        <h1>Cadastro de Aluno</h1>

        <p class="descricao">
            Preencha seus dados para fazer parte da nossa academia!
        </p>

        <form>

            <div class="form-control">
                <label for="nome">Nome</label>
                <input 
                    type="text" 
                    id="nome"
                    placeholder="Digite seu nome completo"
                >
            </div>

            <div class="form-control">
                <label for="email">E-mail</label>
                <input 
                    type="email" 
                    id="email"
                    placeholder="Digite seu e-mail"
                >
            </div>

            <div class="form-control">
                <label for="telefone">Telefone</label>
                <input 
                    type="tel" 
                    id="telefone"
                    placeholder="(00) 00000-0000"
                >
            </div>

            <div class="form-control">
                <label for="data">Data de nascimento</label>
                <input 
                    type="date" 
                    id="data"
                >
            </div>

            <div class="form-control">
                <label for="senha">Senha</label>
                <input 
                    type="password" 
                    id="senha"
                    placeholder="Digite sua senha"
                >
            </div>

            <div class="form-control">
                <label for="plano">Plano de matrícula</label>

                <select id="plano">
                    <option value="">Selecione um plano</option>
                    <option>Plano Básico</option>
                    <option>Plano Premium</option>
                    <option>Plano VIP</option>
                    <option>Plano Mensal</option>
                </select>
            </div>

            <button type="submit">
                Cadastrar
            </button>

        </form>

    </div>

</body>
</html>
